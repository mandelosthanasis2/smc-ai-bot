[pytest]
# NRM Bot test suite configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
markers =
    unit: Fast isolated unit tests (no I/O, no network)
    strategy: Strategy logic tests (entry/exit/sizing)
    risk: Risk-management and position-sizing tests
