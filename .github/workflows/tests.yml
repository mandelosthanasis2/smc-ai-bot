name: tests

# Run the pytest suite on every pull request, and on pushes to the
# deploy/base branches so merges stay green.
on:
  pull_request:
  push:
    branches: [new-ui, main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # README: Python 3.12+
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Runtime deps (also guards requirements.txt installing cleanly —
          # a past deploy-breaker). The test suite itself only needs pytest,
          # since the strategy modules are dependency-injected.
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest
